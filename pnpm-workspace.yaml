packages:
  - "apps/*"
  - "packages/*"
  - "tooling/*"
  - "e2e/*"
  - "memory/"
  - infra

allowBuilds:
  # Install-time code exec — do not extend without review.
  "@sentry/cli": true
  core-js: true
  core-js-pure: false
  dtrace-provider: false
  esbuild: true
  fallow: true
  lefthook: true
  protobufjs: true
  re2: true
  sharp: true
  workerd: true

catalog:
  "@playwright/test": 1.62.1
  "@sentry/nextjs": 11.6.0
  "@types/node": 24.13.3
  "@varlock/infisical-plugin": 2.1.3
  better-auth: 1.7.7
  blume: 2.2.3
  "server-only": 0.0.1
  typescript: 7.0.2
  varlock: 1.22.0
catalogs:
  next:
    "@next/bundle-analyzer": 16.4.0
    next: 16.4.0
  orpc:
    "@orpc/client": 2.0.0-beta.43
    "@orpc/evlog": 2.0.0-beta.43
    "@orpc/server": 2.0.0-beta.43
    "@orpc/tanstack-query": 2.0.0-beta.43
  react:
    "@types/react": 19.3.0
    "@types/react-dom": 19.3.0
    react: 19.3.0
    "react-dom": 19.3.0
  tanstack:
    "@tanstack/react-query": 5.101.4
    "@tanstack/react-query-devtools": 5.101.4
  tailwind:
    "@tailwindcss/postcss": 4.3.3
    tailwindcss: 4.3.3
  effect:
    "@effect/platform-bun": 4.0.2
    "@effect/platform-node": 4.0.2
    effect: 4.0.2
overrides:
  "@next/env": "npm:@varlock/nextjs-integration"
